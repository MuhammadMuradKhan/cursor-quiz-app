<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - LMS</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container-sm" style="margin-top: 100px;">
        <div class="card">
            <div class="card-header text-center">
                <h1 class="card-title">Forgot Password</h1>
            </div>
            
            <div id="alert-container"></div>
            
            <form id="forgotForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your registered email" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send Reset Link</button>
            </form>
            
            <div class="text-center mt-20">
                <a href="login.html">Back to Login</a>
            </div>
        </div>
    </div>
    
    <script src="assets/js/app.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Sending...';
            
            const email = document.getElementById('email').value;
            const result = await forgotPassword(email);
            
            showAlert(result.message, result.success ? 'success' : 'info');
            
            if (result.success) {
                document.getElementById('forgotForm').style.display = 'none';
            } else {
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';
            }
        });
        
        function showAlert(message, type) {
            const container = document.getElementById('alert-container');
            container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }
    </script>
</body>
</html>
