<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - LMS</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container-sm" style="margin-top: 100px;">
        <div class="card">
            <div class="card-header text-center">
                <h1 class="card-title">Reset Password</h1>
            </div>
            
            <div id="alert-container"></div>
            
            <form id="resetForm">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Minimum 8 characters" required minlength="8">
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" class="form-control" placeholder="Confirm new password" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Reset Password</button>
            </form>
            
            <div class="text-center mt-20">
                <a href="login.html">Back to Login</a>
            </div>
        </div>
    </div>
    
    <script src="assets/js/app.js"></script>
    <script>
        const token = getUrlParam('token');
        
        if (!token) {
            showAlert('Invalid reset link. Please request a new one.', 'danger');
            document.getElementById('resetForm').style.display = 'none';
        }
        
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'danger');
                return;
            }
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Resetting...';
            
            const result = await resetPassword(token, password);
            
            if (result.success) {
                showAlert('Password reset successful! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                showAlert(result.message, 'danger');
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        });
        
        function showAlert(message, type) {
            const container = document.getElementById('alert-container');
            container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }
    </script>
</body>
</html>
