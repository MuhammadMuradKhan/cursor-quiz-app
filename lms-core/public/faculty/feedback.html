<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - LMS</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>LMS - Faculty</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="feedback.html" class="active">Feedback</a>
            <a href="#" onclick="logout(); return false;">Logout</a>
        </nav>
    </header>
    
    <div class="container">
        <div id="alert-container"></div>
        
        <div class="row">
            <div class="col-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Student Feedback</h3>
                    </div>
                    <div id="studentFeedback">
                        <div class="loading"><div class="spinner"></div></div>
                    </div>
                </div>
            </div>
            
            <div class="col-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Submit Feedback</h3>
                    </div>
                    
                    <form id="feedbackForm">
                        <div class="form-group">
                            <label for="feedbackType">Feedback Type</label>
                            <select id="feedbackType" class="form-control" required>
                                <option value="">Select type...</option>
                                <option value="system">System Issue</option>
                                <option value="general">General Suggestion</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="content">Your Feedback</label>
                            <textarea id="content" class="form-control" rows="5" placeholder="Write your feedback here..." required></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Submit Feedback</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../assets/js/app.js"></script>
    <script>
        let currentUser = null;
        
        (async () => {
            currentUser = await requireAuth(['faculty', 'admin']);
            if (!currentUser) return;
            
            loadFeedback();
        })();
        
        async function loadFeedback() {
            const container = document.getElementById('studentFeedback');
            const result = await getFacultyFeedback();
            
            if (!result.success) {
                container.innerHTML = '<p>Failed to load feedback</p>';
                return;
            }
            
            const allFeedback = [...(result.data.course_feedback || []), ...(result.data.faculty_feedback || [])];
            
            if (allFeedback.length === 0) {
                container.innerHTML = '<p style="color: #666;">No feedback received yet</p>';
                return;
            }
            
            let html = '';
            for (const fb of allFeedback) {
                html += `
                    <div style="padding: 15px; border-bottom: 1px solid #eee;">
                        <div class="flex-between">
                            <span>
                                <span class="badge badge-info">${fb.feedback_type}</span>
                                <strong>${escapeHtml(fb.user_name)}</strong>
                            </span>
                            <small style="color: #666;">${formatDate(fb.created_at)}</small>
                        </div>
                        <p style="margin-top: 10px;">${escapeHtml(fb.content)}</p>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }
        
        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const feedbackType = document.getElementById('feedbackType').value;
            const content = document.getElementById('content').value;
            
            const result = await submitFeedback(feedbackType, content);
            
            if (result.success) {
                showAlert('Feedback submitted successfully!', 'success');
                document.getElementById('feedbackForm').reset();
            } else {
                showAlert(result.message, 'danger');
            }
        });
        
        function showAlert(message, type) {
            const container = document.getElementById('alert-container');
            container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }
    </script>
</body>
</html>
