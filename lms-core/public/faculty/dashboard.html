<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard - LMS</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>LMS - Faculty</h1>
        <nav>
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="feedback.html">Feedback</a>
            <a href="#" onclick="logout(); return false;">Logout</a>
        </nav>
    </header>
    
    <div class="container">
        <div id="alert-container"></div>
        
        <h2 style="margin-bottom: 20px;">Welcome, <span id="userName">Faculty</span>!</h2>
        
        <!-- Create Course -->
        <div class="card">
            <div class="card-header flex-between">
                <h3 class="card-title">My Courses</h3>
                <button class="btn btn-primary btn-sm" onclick="showCreateCourseModal()">+ Create Course</button>
            </div>
            <div id="coursesList">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
    </div>
    
    <!-- Create Course Modal -->
    <div id="createCourseModal" class="modal-overlay hidden" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>Create New Course</h3>
                <button class="modal-close" onclick="hideCreateCourseModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="createCourseForm">
                    <div class="form-group">
                        <label for="courseName">Course Name *</label>
                        <input type="text" id="courseName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="courseCode">Course Code *</label>
                        <input type="text" id="courseCode" class="form-control" placeholder="e.g., CS101" required>
                    </div>
                    <div class="form-group">
                        <label for="courseDescription">Description</label>
                        <textarea id="courseDescription" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-6">
                            <div class="form-group">
                                <label for="startDate">Start Date</label>
                                <input type="date" id="startDate" class="form-control">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group">
                                <label for="endDate">End Date</label>
                                <input type="date" id="endDate" class="form-control">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideCreateCourseModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createNewCourse()">Create Course</button>
            </div>
        </div>
    </div>
    
    <script src="../assets/js/app.js"></script>
    <script>
        let currentUser = null;
        
        (async () => {
            currentUser = await requireAuth(['faculty', 'admin']);
            if (!currentUser) return;
            
            document.getElementById('userName').textContent = currentUser.name;
            loadCourses();
        })();
        
        async function loadCourses() {
            const container = document.getElementById('coursesList');
            const result = await getCourses();
            
            if (!result.success) {
                container.innerHTML = '<p>Failed to load courses</p>';
                return;
            }
            
            const courses = result.data;
            
            if (courses.length === 0) {
                container.innerHTML = '<p style="padding: 20px; color: #666;">No courses yet. Create your first course!</p>';
                return;
            }
            
            let html = '<table class="table"><thead><tr><th>Course</th><th>Code</th><th>Students</th><th>Pending</th><th>Actions</th></tr></thead><tbody>';
            
            for (const course of courses) {
                html += `
                    <tr>
                        <td><strong>${escapeHtml(course.name)}</strong></td>
                        <td>${escapeHtml(course.code)}</td>
                        <td><span class="badge badge-success">${course.enrolled_count || 0}</span></td>
                        <td>${course.pending_count > 0 ? `<span class="badge badge-warning">${course.pending_count}</span>` : '-'}</td>
                        <td>
                            <a href="course-manage.html?id=${course.id}" class="btn btn-primary btn-sm">Manage</a>
                            <button class="btn btn-secondary btn-sm" onclick="showInviteLink('${course.invite_code}')">Invite Link</button>
                        </td>
                    </tr>
                `;
            }
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }
        
        function showCreateCourseModal() {
            document.getElementById('createCourseModal').classList.remove('hidden');
        }
        
        function hideCreateCourseModal() {
            document.getElementById('createCourseModal').classList.add('hidden');
        }
        
        function closeModal(event) {
            if (event.target.classList.contains('modal-overlay')) {
                hideCreateCourseModal();
            }
        }
        
        async function createNewCourse() {
            const data = {
                name: document.getElementById('courseName').value,
                code: document.getElementById('courseCode').value,
                description: document.getElementById('courseDescription').value,
                start_date: document.getElementById('startDate').value || null,
                end_date: document.getElementById('endDate').value || null
            };
            
            const result = await createCourse(data);
            
            if (result.success) {
                hideCreateCourseModal();
                showAlert('Course created successfully!', 'success');
                loadCourses();
                
                // Show invite link
                showInviteLink(result.data.invite_code);
            } else {
                showAlert(result.message, 'danger');
            }
        }
        
        function showInviteLink(inviteCode) {
            const url = window.location.origin + '/lms-core/public/register.html?invite=' + inviteCode;
            prompt('Share this invite link with students:', url);
        }
        
        function showAlert(message, type) {
            const container = document.getElementById('alert-container');
            container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }
    </script>
</body>
</html>
